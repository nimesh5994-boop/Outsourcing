{% extends "base.html" %}
{% block content %}
<div class="card auth-card">
  <h1>Choose a new password</h1>
  {% if valid %}
  {% if error %}<p class="error-text">{{ error }}</p>{% endif %}
  <form method="post" action="/reset-password">
    <input type="hidden" name="token" value="{{ token }}">
    <label>New password</label>
    <input type="password" name="password" required minlength="8" autofocus>
    <div style="margin-top:16px"><button type="submit">Set new password</button></div>
  </form>
  {% else %}
  <p class="error-text">This reset link is invalid or has expired.</p>
  <p class="muted"><a href="/forgot-password">Request a new one</a>.</p>
  {% endif %}
</div>
{% endblock %}
