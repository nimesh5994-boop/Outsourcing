{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Clients</h1>
  {% if clients %}
  <table>
    <tr><th>Client</th><th>Created</th><th></th></tr>
    {% for c in clients %}
    <tr>
      <td>{{ c.name }}</td>
      <td class="muted">{{ c.created_at[:10] }}</td>
      <td><a class="button secondary" href="/clients/{{ c.id }}">Open</a></td>
    </tr>
    {% endfor %}
  </table>
  {% else %}
  <p class="muted">No clients yet.</p>
  {% endif %}
</div>

<div class="card">
  <h2>Add a client</h2>
  <form method="post" action="/clients">
    <label>Client name</label>
    <input type="text" name="name" required placeholder="e.g. Acme Retail Ltd">
    <div style="margin-top:16px"><button type="submit">Create client</button></div>
  </form>
</div>
{% endblock %}
