{% extends "base.html" %}
{% block content %}
<div class="card auth-card">
  <h1>Log in</h1>
  {% if reset == "1" %}<p class="success-text">Password updated - log in with your new password.</p>{% endif %}
  {% if error %}<p class="error-text">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email</label>
    <input type="email" name="email" required autofocus>
    <label>Password</label>
    <input type="password" name="password" required>
    <div style="margin-top:16px"><button type="submit">Log in</button></div>
  </form>
  <p class="muted" style="margin-top:16px"><a href="/forgot-password">Forgot your password?</a></p>
  <p class="muted">New practice? Signup is invite-only - <a href="/practices">more info</a>.</p>
</div>
{% endblock %}
